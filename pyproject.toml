[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-skill-extractor"
version = "0.1.0"
description = "NLP tool that extracts technical skills from resumes and matches them against job descriptions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.10.3",
    "pandas>=2.1.3",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.28.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "ruff>=0.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resume_skill_extractor = ["skills_db.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
